<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartUp Ops</title>
  <link rel="icon" type="image/svg+xml" href="https://cartup.com/new/cartup-logo-voucher.svg" />
  <script>
    // Restore path after GitHub Pages 404 redirect
    (function() {
      var p = window.location.search.slice(1).split('&').find(function(s) { return s.startsWith('p=') });
      if (p) {
        var path = decodeURIComponent(p.slice(2));
        window.history.replaceState(null, null, '/' + path);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
